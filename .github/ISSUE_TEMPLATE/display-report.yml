name: New display report
description: Send in what an NFC e-paper display KegInker doesn't support says about itself.
title: "Display report: <brand> <model>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping KegInker support more displays. In the app, open
        **Advanced → Report a display**, hold the display to your phone, then
        **Open a GitHub issue**. See
        [USAGE.md](https://github.com/cacack/keginker/blob/main/USAGE.md#report-an-unsupported-display).
  - type: textarea
    id: report
    attributes:
      label: Display report
      description: The report from the app, unedited. If it isn't filled in already, it's on your clipboard; paste it here.
      render: text
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Brand and model
      description: As printed on the display, its driver board or the box.
      placeholder: Waveshare 2.9" NFC-Powered e-Paper
    validations:
      required: true
  - type: textarea
    id: photo
    attributes:
      label: Photo
      description: A photo of the display, and of any label or printing on its back. Drag the images in here.
    validations:
      required: true
  - type: input
    id: panel-size
    attributes:
      label: Panel size
      description: The screen's diagonal, as the seller or box gives it, if you know it.
      placeholder: 2.9"
    validations:
      required: false
  - type: dropdown
    id: colors
    attributes:
      label: Colors
      description: How many colors the display can show.
      options:
        - 2 (black and white)
        - 3 (black, white, red)
        - 4 (black, white, yellow, red)
        - Other or not sure
    validations:
      required: true
  - type: input
    id: purchase-link
    attributes:
      label: Where you bought it
      description: A link to the listing, if you have one.
      placeholder: https://…
    validations:
      required: false
  - type: input
    id: vendor-app
    attributes:
      label: Vendor app
      description: The app the seller tells you to use with the display, if any.
      placeholder: NFC e-Paper (Waveshare)
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What happened when you used the vendor app with the display.
    validations:
      required: false
