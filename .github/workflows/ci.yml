name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Shared tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :sharedLogic:testAndroidHostTest :sharedUI:testAndroidHostTest

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :androidApp:testDebugUnitTest
      # Signed with the runner's debug key: the release key is only for
      # releases (docs/operations/signing.md).
      - run: ./gradlew :androidApp:assembleDebug
        env:
          # A pull request's GITHUB_SHA is a temporary merge commit; report its head instead.
          KEGINKER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keginker-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    name: iOS build
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Gradle bakes the commit into iOS reports (BuildInfo); report a pull request's head, as on Android.
      KEGINKER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Xcode build phase runs Gradle to compile the shared framework.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :sharedLogic:iosSimulatorArm64Test
      - name: Build app (simulator, unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator -arch arm64 \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Test app (simulator, unsigned)
        run: |
          # Any available iPhone simulator; runner images change their names.
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for r, ds in json.load(sys.stdin)["devices"].items() if "iOS" in r for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO test
      # CONSTITUTION.md C4; the release workflow runs the same check on the signed app.
      - name: Check permissions (C4)
        run: |
          .github/scripts/check-ios-permissions.sh \
            build/ios/Build/Products/Debug-iphonesimulator/KegInker.app \
            iosApp/Configuration/keginker.entitlements
      # App Store Connect rejects an upload without an app icon, which no
      # simulator build complains about.
      - name: Check app icon
        run: |
          if ! /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' \
              build/ios/Build/Products/Debug-iphonesimulator/KegInker.app/Info.plist; then
            echo "::error::The iOS app has no icon (CFBundleIconName); App Store Connect would reject it"
            exit 1
          fi

  # Gate job for branch protection - only require this one check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, android, ios]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
