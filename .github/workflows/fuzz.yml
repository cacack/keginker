name: Fuzz

# The Jazzer fuzz targets in fuzz/, through ClusterFuzzLite; see
# docs/operations/ci.md. Pull requests fuzz for 5 minutes, the weekly run for 30.
on:
  pull_request:
  schedule:
    - cron: '0 6 * * 4'

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz tag replies
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event_name == 'schedule' && 1800 || 300 }}
          mode: ${{ github.event_name == 'schedule' && 'batch' || 'code-change' }}
          sanitizer: address
