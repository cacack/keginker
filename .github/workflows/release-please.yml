name: release-please

# Keeps a release PR open from conventional commits on main. Merging it
# creates the vX.Y.Z tag and GitHub Release; the tag triggers release.yml,
# which attaches the signed APK. See docs/operations/signing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Authenticate via this repo's release-please GitHub App (token minted at
# job time) rather than `GITHUB_TOKEN`. Events generated by the default
# GITHUB_TOKEN do not trigger downstream workflows, so release PRs it
# opens never run CI and the tags it creates never trigger release.yml.
# App-minted tokens are treated as first-class actors and do trigger both.
permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Only what release-please uses, whatever else the App holds:
          # branches, tags and releases (contents), and the release PR and
          # its `autorelease:` labels (pull-requests).
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
