name: Release

# Merging the release-please PR creates a vMAJOR.MINOR.PATCH (optionally
# -suffix) tag and its GitHub Release; this workflow attaches an APK signed by
# the release key and an App Store-signed ipa, which it also uploads to
# TestFlight. See docs/operations/signing.md.
#
# Build jobs run Gradle and Xcode, and so third-party build code, with the
# signing secrets from the `release` environment but only a read token.
# Publish jobs run no build code: they take the built files, attest them and
# upload them, holding the write, OIDC and attestation permissions.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check tag and read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      marketing: ${{ steps.version.outputs.marketing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only reviewed code gets the release keys and a public release.
      - name: Require the tag to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$GITHUB_REF_NAME' points at a commit that isn't on main"
            exit 1
          fi
      # Only a merged release PR publishes: release-please creates the release
      # together with its tag, so a hand-pushed tag has none.
      - name: Require a release-please release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null; then
            echo "::error::Tag '$GITHUB_REF_NAME' has no GitHub Release; releases are cut by merging the release-please PR"
            exit 1
          fi

      # versionCode = ((MAJOR*100 + MINOR)*100 + PATCH)*100 + slot, where the
      # slot orders pre-releases below the final release: alpha.N = N,
      # beta.N = 32+N, rc.N = 64+N (N 1-31), final = 99. Apple rejects a
      # pre-release suffix, so iOS gets marketing = MAJOR.MINOR.PATCH.
      - name: Read version from tag
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' isn't vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-(alpha|beta|rc).N"
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]})) minor=$((10#${BASH_REMATCH[2]})) patch=$((10#${BASH_REMATCH[3]}))
          stage=${BASH_REMATCH[5]} n=${BASH_REMATCH[6]:+$((10#${BASH_REMATCH[6]}))}
          if (( major > 213 || minor > 99 || patch > 99 )); then
            echo "::error::MAJOR must be 0-213 and MINOR, PATCH 0-99 to fit the version code"
            exit 1
          fi
          case "$stage" in
            "") slot=99 ;;
            alpha) slot=$n ;;
            beta) slot=$(( 32 + n )) ;;
            rc) slot=$(( 64 + n )) ;;
          esac
          if [[ -n "$stage" ]] && (( n < 1 || n > 31 )); then
            echo "::error::Pre-release number must be 1-31"
            exit 1
          fi
          code=$(( ((major * 100 + minor) * 100 + patch) * 100 + slot ))
          if (( code <= 1 )); then
            echo "::error::Version code $code wouldn't be above dev builds (1)"
            exit 1
          fi
          {
            echo "name=${GITHUB_REF_NAME#v}"
            echo "code=$code"
            echo "prerelease=$([[ -n "$stage" ]] && echo true || echo false)"
            echo "marketing=$major.$minor.$patch"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Build Android release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 isn't set; releases must be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          KEGINKER_KEYSTORE: ${{ runner.temp }}/release.jks
          KEGINKER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEGINKER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEGINKER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.prepare.outputs.name }}
          VERSION_CODE: ${{ needs.prepare.outputs.code }}
        run: |
          ./gradlew :sharedLogic:testAndroidHostTest :sharedUI:testAndroidHostTest :androidApp:assembleRelease \
            -Pkeginker.versionName="$VERSION_NAME" -Pkeginker.versionCode="$VERSION_CODE"

      - name: Verify signature and package
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.name }}
        run: |
          # Gradle names the APK -unsigned.apk when no key is configured, so
          # this path also fails fast on an unsigned build.
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          # The newest installed build-tools.
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" "dist/keginker-$VERSION_NAME.apk"
          (cd dist && sha256sum "keginker-$VERSION_NAME.apk" > "keginker-$VERSION_NAME.apk.sha256")

      # CONSTITUTION.md C4. The system photo picker needs no permission, and
      # AndroidX adds an app-private permission for its own receivers.
      - name: Check permissions (C4)
        run: |
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          aapt2="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -1)/aapt2"
          pkg=$("$aapt2" dump packagename "$apk")
          extra=$("$aapt2" dump permissions "$apk" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" \
            | grep -v -x -e android.permission.NFC -e "$pkg.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          if [ -n "$extra" ]; then
            echo "::error::C4: the release APK requests permissions beyond NFC: $extra"
            exit 1
          fi
          echo "C4: the release APK requests only NFC"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  android-publish:
    name: Publish Android release
    needs: [prepare, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance for the APK (CONSTITUTION.md C5).
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # Fails if the files don't match the digest the build job uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release
          path: dist

      # CONSTITUTION.md C5: anyone can check the APK was built here, from
      # this tag, with `gh attestation verify <apk> -R <owner>/<repo>`.
      - name: Attest build provenance (C5)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.apk

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ needs.prepare.outputs.name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*
          gh release edit "$GITHUB_REF_NAME" --title "KegInker $VERSION_NAME" --prerelease="$PRERELEASE"

  ios:
    name: Build iOS release
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    env:
      # Signing uses an App Store Connect API key with cloud-managed automatic
      # signing, so no certificate or profile is stored.
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      VERSION_NAME: ${{ needs.prepare.outputs.name }}
      MARKETING_VERSION: ${{ needs.prepare.outputs.marketing }}
      # Rises with every release and every re-run, as App Store Connect requires.
      BUILD_NUMBER: ${{ needs.prepare.outputs.code }}.${{ github.run_attempt }}
      # The Xcode build phase's Gradle run bakes this into BuildInfo.
      ORG_GRADLE_PROJECT_keginker.versionName: ${{ needs.prepare.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Xcode build phase runs Gradle to compile the shared framework.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          missing=()
          [ -n "$TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          [ -n "$ASC_KEY_ID" ] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "$ASC_ISSUER_ID" ] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -n "$ASC_KEY_P8" ] || missing+=(APP_STORE_CONNECT_KEY_P8)
          if (( ${#missing[@]} )); then
            echo "::error::${missing[*]} not set; iOS releases must be signed"
            exit 1
          fi
          # altool finds the key by this name in API_PRIVATE_KEYS_DIR.
          mkdir "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "API_PRIVATE_KEYS_DIR=$RUNNER_TEMP/private_keys" >> "$GITHUB_ENV"

      # Debug builds add a simulated tag, the CRC picker and NFC logging.
      - name: Require a release build without DEBUG
        run: |
          conditions=$(xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -showBuildSettings | sed -n 's/^ *SWIFT_ACTIVE_COMPILATION_CONDITIONS = //p')
          if grep -qw DEBUG <<< "$conditions"; then
            echo "::error::The Release configuration sets DEBUG: $conditions"
            exit 1
          fi

      - name: Archive
        run: |
          xcodebuild archive -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/KegInker.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            TEAM_ID="$TEAM_ID" MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export ipa
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert signingStyle -string automatic "$options"
          plutil -insert teamID -string "$TEAM_ID" "$options"
          plutil -insert destination -string export "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          plutil -insert uploadSymbols -bool YES "$options"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/KegInker.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          mkdir dist
          cp "$RUNNER_TEMP"/export/*.ipa "dist/keginker-$VERSION_NAME.ipa"
          (cd dist && shasum -a 256 "keginker-$VERSION_NAME.ipa" > "keginker-$VERSION_NAME.ipa.sha256")

      # CONSTITUTION.md C4, on the entitlements the distribution signature carries.
      - name: Check permissions (C4)
        run: |
          unzip -q "dist/keginker-$VERSION_NAME.ipa" -d "$RUNNER_TEMP/ipa"
          app=$(echo "$RUNNER_TEMP"/ipa/Payload/*.app)
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist"
          .github/scripts/check-ios-permissions.sh "$app" "$RUNNER_TEMP/entitlements.plist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  ios-publish:
    name: Publish iOS release
    needs: [prepare, ios]
    runs-on: macos-latest
    timeout-minutes: 20
    # The App Store Connect key uploads to TestFlight.
    environment: release
    permissions:
      contents: write
      # Build provenance for the ipa (CONSTITUTION.md C5).
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      VERSION_NAME: ${{ needs.prepare.outputs.name }}
    steps:
      # Fails if the files don't match the digest the build job uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-release
          path: dist

      # CONSTITUTION.md C5: anyone can check the ipa was built here, from
      # this tag, with `gh attestation verify <ipa> -R <owner>/<repo>`.
      - name: Attest build provenance (C5)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.ipa

      # The build job checked the secrets are set.
      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          # altool finds the key by this name in API_PRIVATE_KEYS_DIR.
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          mkdir "$API_PRIVATE_KEYS_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-package "dist/keginker-$VERSION_NAME.ipa" \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID"

      - name: Attach the ipa to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*
